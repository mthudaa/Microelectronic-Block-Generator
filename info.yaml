# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "MBG-D08: AI-generated analog block array"
  team: "D08 Microelectronic Block Generator"
  discord: "mthudaa"            # carried from MBG-Public/info.yaml
  description: "Integrated top-level GDS combining nine AI/LLM-generated analog blocks (3x 5T-OTA, 3x StrongArm comparator, 3x 1.2V reference) and the NEURO1B spiking temperature sensor (designed with Opus 5.5), which replaces the earlier relaxation-oscillator sensor on the temp_out pin (pin name unchanged), behind 14 secondary-ESD analog pads (gLayout track, GF180MCU-D)"
  lvs_config: "lvs_config.json"
  # Readiness fields below are carried from MBG-Public/info.yaml (your published values) and
  # were NOT re-decided here. Evidence for this layout: DRC and LVS pass (verify-*.json),
  # landing matches the committee D08_BV.def. ws_def_ready is true by D08 team decision: the D08 team is
  # responsible for the block area only; wafer.space frame confirmation is handled by the Chipathon committee.
  gf_def_ready: true
  ws_def_ready: true 
  drc_ready: true
  lvs_ready: true
  export_control: "Export_Control_GF_Rev8.2_signed.docx"

# ======================================================
# Pin connections to the external pads.
#
# Current layout: mbg_d08 (sha256 229ad297...), block 605 x 1110 um,
# orientation NORMAL (mirror_x=false, mirror_y=false), matching the committee D08_BV.def
# (pin map used as the block DEF). Pin coordinates below are from the GDS labels
# (mbg-toplevel/floorplan/pin_positions_normal.json).
#
# Sign-off on this GDS (mbg-toplevel/verification/):
#   Magic DRC 0, KLayout DRC 0 (dual-engine PASS); netgen LVS match against
#   mbg-d08_lvs.spice; coupled PEX 318 C / 0 R (same as normal orientation).
#   Full-RC PEX: FAIL (Magic stops; open).
#
# OPEN with the organizer (@d-m-bailey):
# Author name drawn on the top metal (Metal5, 81/0, floating): "M Taufiqul Huda", "D08 - Microelectronic Block Generator".
#
#   1. Orientation: DECIDED by the D08 team: NORMAL, matching the committee D08_BV.def.
#      (The floorplanner lists D08 as mirror_x/mirror_y; the organizers should be told.)
#   2. PR boundary: DECIDED: follows the committee D08_BV.def DIEAREA, 605 x 1110 um
#      (the 550 um figure in D08_BV_interface.yaml is the old GDS size record).
#   3. temp_out / W12: DECIDED by the D08 team: NEURO1B replaces the earlier temperature sensor on this pin (it is not an overlay);
#      the pin name temp_out is kept on purpose.
#   4. Pad cells: no dvdd/dvss/vdd/vss pad instances in the GDS. The pad rule
#      needs organizer confirmation.
#   5. Double ESD: the block's io_secondary_3p3 cells sit behind the pad's
#      asig_5p0 secondary ESD. Confirm this is intended.
#
# Slot order is W12..W22 up the west edge, then N01..N05 left-to-right
# along the north edge. Coordinates are the label positions, measured from
# the layout. ORDER IS PHYSICAL - do not re-group these by function.
#
# All 14 signal pins are analog, each behind its own io_secondary_3p3
# secondary-ESD cell. vdd/vss are power/ground: secondary_esd is analog-only.
# ======================================================
pins:
  #    *** PIN MAP (normal orientation; coordinates below are from the GDS labels) ***
  #                                     clk
  #                                 inn |
  #                             inp |   |
  #                       ibias  |   |  |
  #                 vdd     |    |   |  |
  #                       ||  || ||  || ||
  #                       ||  || ||  || ||
  #                       ||  || ||  || ||
  #           vss   ====== ---------------
  #  deepseek_ota   ====== |             |
  #       gpt_ota   ====== |             |
  #       oxa_ota   ====== |             |
  #  deepseek_cmp   ====== |             |
  #       gpt_cmp   ====== |     BV      |
  #       oxa_cmp   ====== |             |
  # deepseek_vref   ====== |             |
  #      gpt_vref   ====== |             |
  #      oxa_vref   ====== |             |
  #      temp_out   ====== |_____________|
  #
  # --- west edge, bottom -> top (slots W12..W22) -------------------------
  - name: temp_out            # W12  (   0.50,   42.50)  NEURO1B spiking temp sensor, designed with Opus 5.5 (via temp_out_core)
    io_type: analog
    secondary_esd: true
  - name: oxa_vref            # W13  (   0.50,  142.50)  1.2 V reference, Opus 5.5
    io_type: analog
    secondary_esd: true
  - name: gpt_vref            # W14  (   0.50,  242.50)  1.2 V reference, GPT-6.2 Sol
    io_type: analog
    secondary_esd: true
  - name: deepseek_vref       # W15  (   0.50,  342.50)  1.2 V reference, Gemini 4 Argon (neon fallback)
    io_type: analog
    secondary_esd: true
  - name: oxa_cmp             # W16  (   0.50,  442.50)  comparator OUTP, Opus 5.5 (OUTN internal)
    io_type: analog
    secondary_esd: true
  - name: gpt_cmp             # W17  (   0.50,  542.50)  comparator OUTP, GPT-6.2 Sol (OUTN internal)
    io_type: analog
    secondary_esd: true
  - name: deepseek_cmp        # W18  (   0.50,  642.50)  comparator OUTP, Gemini 4 Argon (neon fallback) (OUTN internal)
    io_type: analog
    secondary_esd: true
  - name: oxa_ota             # W19  (   0.50,  742.50)  5T-OTA OUT, Opus 5.5
    io_type: analog
    secondary_esd: true
  - name: gpt_ota             # W20  (   0.50,  842.50)  5T-OTA OUT, GPT-6.2 Sol
    io_type: analog
    secondary_esd: true
  - name: deepseek_ota        # W21  (   0.50,  942.50)  5T-OTA OUT, Gemini 4 Argon (neon fallback)
    io_type: analog
    secondary_esd: true
  - name: vss                 # W22  (   0.50, 1042.50)  quiet ground (mirrored)
    io_type: ground

  # --- north edge, left -> right (slots N01..N05) ------------------------
  - name: vdd                 # N01  (  67.50, 1109.50)  3.3 V rail (mirrored)
    io_type: power
  - name: ibias               # N02  ( 167.50, 1109.50)  bias current -> ibias_core (3 OTAs + 3 VREFs)
    io_type: analog
    secondary_esd: true
  - name: inp                 # N03  ( 267.50, 1109.50)  differential input + -> inp_core
    io_type: analog
    secondary_esd: true
  - name: inn                 # N04  ( 367.50, 1109.50)  differential input - -> inn_core
    io_type: analog
    secondary_esd: true
  - name: clk                 # N05  ( 467.50, 1109.50)  comparator sampling clock -> clk_core
    io_type: analog
    secondary_esd: true
