# Specification Template
# Fill in your design requirements

# Design Information
name: "ota_simple"
description: "5-transistor single-stage OTA"
technology: "GF180MCU"  # or "Sky130"

# Supply
vdd: 1.8
vss: 0.0

# Performance Targets
specs:
  dc_gain_db:
    min: 60
    target: 70
  gbw_mhz:
    min: 1
    target: 5
  phase_margin_deg:
    min: 45
    target: 60
  power_mw:
    max: 0.5
  output_swing_v:
    min: 1.0
  slew_rate_v_us:
    min: 0.5

# Load
load_capacitance_pf: 5

# Temperature Range
temp_min: -40
temp_max: 125

# Input/Output
input_common_mode_range:
  min: 0.3
  max: 1.5
